name: Fix late import

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-late-import.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply late import
        run: |
          set -euxo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('studio_frames.py')
          t = p.read_text(encoding='utf-8')
          old = '''            elif getattr(self, "active_pdf_path", None):
                pages = PDFChatEngine.extract_document_pages(self.active_pdf_path)
                s, _ = PDFChatEngine.query_local_bm25(pages, "executive summary and key objectives")
                txt_content.delete("1.0", "end")
                txt_content.insert("1.0", s)'''
          new = '''            elif getattr(self, "active_pdf_path", None):
                from App import PDFChatEngine  # late import avoids circular import with App
                pages = PDFChatEngine.extract_document_pages(self.active_pdf_path)
                s, _ = PDFChatEngine.query_local_bm25(pages, "executive summary and key objectives")
                txt_content.delete("1.0", "end")
                txt_content.insert("1.0", s)'''
          if 'from App import PDFChatEngine' in t:
              print('already fixed')
          elif old in t:
              p.write_text(t.replace(old, new), encoding='utf-8')
              print('fixed')
          else:
              raise SystemExit('block not found')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio_frames.py
          if git diff --cached --quiet; then
            echo no change
          else
            git commit -m "fix: late-import PDFChatEngine in studio_frames.py for flake8 F821"
            git push origin HEAD:main
          fi

      - name: Remove workflow
        if: always()
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -f .github/workflows/fix-late-import.yml ]; then
            git rm -f .github/workflows/fix-late-import.yml
            git commit -m "ci: remove one-shot fix-late-import workflow" || true
            git push origin HEAD:main || true
          fi
          if [ -f .github/workflows/restore-studio.yml ]; then
            git rm -f .github/workflows/restore-studio.yml
            git commit -m "ci: remove leftover restore-studio workflow" || true
            git push origin HEAD:main || true
          fi
