name: Restore studio files

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-studio.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore full sources from 9163a2d and apply flake8 fix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail

          echo "=== git log (recent) ==="
          git log --oneline -8

          echo "=== checkout files from 9163a2d ==="
          git checkout 9163a2d -- studio_frames.py studio_engines.py
          wc -c studio_frames.py studio_engines.py
          head -c 80 studio_frames.py | od -An -tx1 | head -2

          python3 << 'PY'
          from pathlib import Path

          for name in ('studio_frames.py', 'studio_engines.py'):
              p = Path(name)
              text = p.read_text(encoding='utf-8-sig')
              p.write_text(text, encoding='utf-8')
              print(f'stripped BOM: {name} ({len(text)} chars)')

          p = Path('studio_frames.py')
          t = p.read_text(encoding='utf-8')
          old = '''            elif getattr(self, "active_pdf_path", None):
                pages = PDFChatEngine.extract_document_pages(self.active_pdf_path)
                s, _ = PDFChatEngine.query_local_bm25(pages, "executive summary and key objectives")
                txt_content.delete("1.0", "end")
                txt_content.insert("1.0", s)'''
          new = '''            elif getattr(self, "active_pdf_path", None):
                from App import PDFChatEngine  # late import avoids circular import with App
                pages = PDFChatEngine.extract_document_pages(self.active_pdf_path)
                s, _ = PDFChatEngine.query_local_bm25(pages, "executive summary and key objectives")
                txt_content.delete("1.0", "end")
                txt_content.insert("1.0", s)'''
          if 'from App import PDFChatEngine' in t:
              print('late import already present')
          elif old in t:
              p.write_text(t.replace(old, new), encoding='utf-8')
              print('applied PDFChatEngine late import')
          else:
              print('WARNING: expected block not found; writing file as-is after BOM strip')
              # still OK if sources are restored
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status
          git add studio_frames.py studio_engines.py
          if git diff --cached --quiet; then
            echo "No changes to commit for studio files"
          else
            git commit -m "fix: restore full studio_frames.py and studio_engines.py (BOM strip + PDFChatEngine late-import for flake8)"
            git push origin HEAD:main
          fi

      - name: Remove this one-shot workflow
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -f .github/workflows/restore-studio.yml ]; then
            git rm -f .github/workflows/restore-studio.yml || rm -f .github/workflows/restore-studio.yml
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "ci: remove one-shot restore-studio workflow" || true
              git push origin HEAD:main || true
            fi
          fi
